<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gold Rush Learning</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --paper: #fbf5e6; --ink: #3b2a1a; --gold: #d4a017; --gold2: #f4c542; --brown: #8b5a2b; --green: #2f9e44; --red: #c92a2a; --blue: #1c7ed6; --card: #fffdf6; --line: #e3d5b5; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); color: var(--ink); font-family: "Segoe UI", "Trebuchet MS", system-ui, sans-serif; font-size: 18px; line-height: 1.5; }
  header { background: linear-gradient(#5a3a1a, #3b2a1a); color: #fff; padding: 12px 20px; display: flex; align-items: center; gap: 14px; position: sticky; top: 0; z-index: 3; }
  header h1 { font-size: 24px; margin: 0; flex: 1; letter-spacing: .5px; }
  header h1 span { color: var(--gold2); }
  main { max-width: 980px; margin: 0 auto; padding: 18px 16px 50px; }
  button { font: inherit; cursor: pointer; border-radius: 10px; border: 0; padding: 10px 18px; font-weight: 600; }
  .btn { background: var(--brown); color: #fff; }
  .btn:hover { filter: brightness(1.1); }
  .btn.gold { background: var(--gold); color: #3b2a1a; }
  .btn.green { background: var(--green); }
  .btn.ghost { background: transparent; color: #fff; border: 2px solid rgba(255,255,255,.6); }
  .btn:disabled { opacity: .45; cursor: not-allowed; filter: none; }
  .progress { background: var(--card); border: 2px solid var(--line); border-radius: 14px; padding: 14px 18px; margin-bottom: 18px; }
  .bar { height: 18px; background: #eadfc4; border-radius: 9px; overflow: hidden; margin-top: 6px; }
  .bar div { height: 100%; background: linear-gradient(90deg, var(--gold), var(--gold2)); transition: width .4s; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
  .card { background: var(--card); border: 2px solid var(--line); border-radius: 14px; overflow: hidden; cursor: pointer; transition: transform .1s, box-shadow .1s; position: relative; }
  .card:hover { transform: translateY(-3px); box-shadow: 0 6px 16px rgba(80,50,10,.18); }
  .card .pic { height: 150px; background: #dfeaf2; }
  .card .pic svg { width: 100%; height: 100%; display: block; }
  .card .body { padding: 10px 14px 14px; }
  .card .num { font-size: 13px; color: var(--brown); font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
  .card h3 { margin: 2px 0 6px; font-size: 20px; }
  .tag { display: inline-block; font-size: 14px; font-weight: 700; padding: 2px 10px; border-radius: 20px; }
  .tag.new { background: #e7f0ff; color: var(--blue); }
  .tag.done { background: #e3f6e6; color: var(--green); }
  .tag.locked { background: #eee; color: #777; }
  .card.quiz { border-color: var(--gold); }
  .card.locked { cursor: not-allowed; }
  .card.locked .pic { filter: grayscale(1) opacity(.55); }
  .lesson { background: var(--card); border: 2px solid var(--line); border-radius: 16px; padding: 22px 26px; }
  .lesson h2 { margin: 0 0 4px; font-size: 30px; }
  .lesson .sub { color: var(--brown); font-weight: 700; margin-bottom: 12px; }
  .figure { border-radius: 12px; overflow: hidden; border: 2px solid var(--line); margin: 14px 0 6px; background: #dfeaf2; }
  .figure svg { width: 100%; height: auto; display: block; }
  .caption { font-size: 15px; color: #6b5640; text-align: center; margin-bottom: 14px; font-style: italic; }
  .lesson p { margin: 10px 0; }
  .words { background: #fff4d6; border: 2px dashed var(--gold); border-radius: 12px; padding: 10px 16px; margin: 16px 0; }
  .words h4 { margin: 0 0 4px; }
  .words dt { font-weight: 700; display: inline; }
  .words dd { display: inline; margin: 0; }
  .words div { margin: 3px 0; }
  .check { background: #eef6ff; border: 2px solid #b9d6f5; border-radius: 12px; padding: 14px 18px; margin-top: 18px; }
  .check h3 { margin: 0 0 6px; }
  .q { margin: 12px 0; }
  .q .qt { font-weight: 700; }
  .opt { display: block; padding: 6px 10px; margin: 4px 0; border-radius: 8px; background: #fff; border: 2px solid #d6e4f2; cursor: pointer; }
  .opt:hover { border-color: var(--blue); }
  .opt input { margin-right: 8px; transform: scale(1.2); }
  .opt.right { border-color: var(--green); background: #e9f9ec; }
  .opt.wrong { border-color: var(--red); background: #fdecec; }
  textarea { width: 100%; min-height: 80px; font: inherit; padding: 8px 10px; border-radius: 8px; border: 2px solid #d6e4f2; }
  .msg { font-weight: 700; margin: 10px 0 0; min-height: 26px; }
  .msg.bad { color: var(--red); } .msg.good { color: var(--green); }
  .stamp { display: inline-block; border: 4px solid var(--green); color: var(--green); font-weight: 900; font-size: 26px; padding: 4px 16px; border-radius: 10px; transform: rotate(-6deg); margin: 10px 0; letter-spacing: 2px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 14px; }
  .quizbox { background: var(--card); border: 3px solid var(--gold); border-radius: 16px; padding: 22px 26px; }
  .quizbox .count { color: var(--brown); font-weight: 700; }
  .quizbox .qt { font-size: 22px; font-weight: 700; margin: 8px 0 12px; }
  .big { font-size: 40px; font-weight: 900; color: var(--brown); }
  .stars { font-size: 40px; letter-spacing: 4px; }
  .review div { margin: 6px 0; padding: 6px 10px; border-radius: 8px; background: #fff; border: 1px solid var(--line); }
  .cert { background: #fffaf0; border: 10px double var(--gold); border-radius: 8px; padding: 30px; text-align: center; margin-top: 16px; }
  .cert h2 { font-family: Georgia, serif; font-size: 34px; margin: 6px 0; color: var(--brown); }
  .cert .who { font-family: Georgia, serif; font-size: 32px; border-bottom: 2px solid var(--ink); display: inline-block; min-width: 60%; margin: 10px 0; }
  .muted { color: #8a7660; font-size: 15px; }
  .hidden { display: none !important; }
  input[type=text] { font: inherit; padding: 6px 10px; border-radius: 8px; border: 2px solid var(--line); }
  #launch { position: fixed; inset: 0; background: rgba(40,25,10,.85); display: none; align-items: center; justify-content: center; z-index: 9; }
  #launch .box { background: var(--card); border-radius: 14px; padding: 22px; width: 380px; text-align: center; border: 3px solid var(--gold); }
  @media print {
    header, .noprint, .row { display: none !important; }
    body { background: #fff; }
    .cert { border-color: #b8860b; }
  }
</style>
</head>

<div id="launch"><div class="box">

const PASS = 12;

// ====================================================================== saving
const KEY = "goldrush-learning";
let save = { done: {}, notes: {}, best: null, name: "" };
try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.done) save = Object.assign(save, s); } catch (e) {}
function store() { try { localStorage.setItem(KEY, JSON.stringify(save)); } catch (e) {} }
const doneCount = () => LESSONS.filter(l => save.done[l.id]).length;
const allDone = () => doneCount() === LESSONS.length;

// ====================================================================== screens
const main = document.getElementById("main");
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function stopTalking() { try { speechSynthesis.cancel(); } catch (e) {} }
document.getElementById("homeBtn").onclick = () => home();

function home() {
  stopTalking(); scrollTo(0, 0);
  const n = doneCount();
  let html = `<div class="progress"><b>Lessons turned in: ${n} of ${LESSONS.length}</b>
    ${allDone() ? ` - the quiz is open! ${save.best != null ? `Your best score: <b>${save.best} of ${QUIZ.length}</b>` : ""}` : ` - turn in every lesson to open the quiz.`}
    <div class="bar"><div style="width:${n / LESSONS.length * 100}%"></div></div></div><div class="cards">`;
  LESSONS.forEach((l, i) => {
    html += `<div class="card" data-lesson="${i}"><div class="pic">${PICS[l.pic]}</div><div class="body">
      <div class="num">Lesson ${i + 1}</div><h3>${esc(l.title)}</h3>
      ${save.done[l.id] ? `<span class="tag done">✓ Turned in</span>` : `<span class="tag new">Not turned in yet</span>`}</div></div>`;
  });
  html += `<div class="card quiz ${allDone() ? "" : "locked"}" id="quizCard"><div class="pic">${PICS.quiz}</div><div class="body">
    <div class="num">Final</div><h3>The Gold Rush Quiz</h3>
    ${allDone() ? `<span class="tag done">Open - ${QUIZ.length} questions</span>` : `<span class="tag locked">🔒 Locked - turn in all ${LESSONS.length} lessons first</span>`}</div></div></div>
    <p class="muted" style="margin-top:22px">Teacher or parent: <a href="#" id="reset">start over</a> (clears turned-in lessons and quiz scores).</p>`;
  main.innerHTML = html;
  main.querySelectorAll("[data-lesson]").forEach(c => c.onclick = () => lesson(+c.dataset.lesson));
  document.getElementById("quizCard").onclick = () => {
    if (allDone()) quizStart();
    else { const next = LESSONS.findIndex(l => !save.done[l.id]); alert(`The quiz is locked.\n\nTurn in all ${LESSONS.length} lessons first. Next up: Lesson ${next + 1}, "${LESSONS[next].title}".`); }
  };
  document.getElementById("reset").onclick = e => {
    e.preventDefault();
    if (confirm("Start over? This clears all turned-in lessons, notes, and quiz scores.")) { save = { done: {}, notes: {}, best: null, name: save.name }; store(); home(); }
  };
}

function lesson(i) {
  stopTalking(); scrollTo(0, 0);
  const l = LESSONS[i], turned = !!save.done[l.id];
  let html = `<div class="lesson"><div class="num" style="color:var(--brown);font-weight:700">LESSON ${i + 1} OF ${LESSONS.length}</div>
    <h2>${esc(l.title)}</h2><div class="sub">${esc(l.sub)}</div>
    <div class="row noprint" style="margin-top:0"><button class="btn gold" id="read">🔊 Read to me</button></div>
    <div class="figure">${PICS[l.pic]}</div><div class="caption">${esc(l.caption)}</div>`;
  l.text.forEach((p, k) => {
    html += `<p>${esc(p)}</p>`;
    if (l.pic2 && k === 2) html += `<div class="figure">${PICS[l.pic2]}</div><div class="caption">${esc(l.caption2)}</div>`;
  });
  html += `<div class="words"><h4>📖 Words to know</h4>${l.words.map(([w, d]) => `<div><dt>${esc(w)}</dt> - <dd>${esc(d)}</dd></div>`).join("")}</div>
    <div class="check"><h3>✏️ Check what you learned</h3>`;
  l.checks.forEach((q, k) => {
    html += `<div class="q" data-q="${k}"><div class="qt">${k + 1}. ${esc(q.q)}</div>${q.a.map((a, j) =>
      `<label class="opt"><input type="radio" name="c${k}" value="${j}" ${turned && j === q.c ? "checked" : ""} ${turned ? "disabled" : ""}>${esc(a)}</label>`).join("")}</div>`;
  });
  html += `<div class="q"><div class="qt">${l.checks.length + 1}. Write one thing you learned in this lesson:</div>
      <textarea id="note" ${turned ? "disabled" : ""} placeholder="I learned that...">${esc(save.notes[l.id] || "")}</textarea></div>
    <div class="msg" id="msg"></div>
    ${turned ? `<div class="stamp">TURNED IN ✓</div>` : ""}
    <div class="row">${turned ? "" : `<button class="btn green" id="turnIn">📥 Turn in lesson</button>`}
      ${i + 1 < LESSONS.length ? `<button class="btn" id="next">Next lesson →</button>` : ""}
      <button class="btn" id="back">Back to lessons</button></div></div></div>`;
  main.innerHTML = html;
  document.getElementById("back").onclick = home;
  const nx = document.getElementById("next"); if (nx) nx.onclick = () => lesson(i + 1);
  document.getElementById("read").onclick = () => {
    try {
      if (speechSynthesis.speaking) { stopTalking(); return; }
      const u = new SpeechSynthesisUtterance([l.title + ".", ...l.text].join(" ").replace(/金山/g, ""));
      u.rate = 0.9; speechSynthesis.speak(u);
    } catch (e) { alert("Read to me doesn't work on this computer."); }
  };
  const ti = document.getElementById("turnIn");
  if (ti) ti.onclick = () => {
    const msg = document.getElementById("msg");
    let allRight = true, missing = false;
    l.checks.forEach((q, k) => {
      const box = main.querySelector(`[data-q="${k}"]`), pick = box.querySelector("input:checked");
      box.querySelectorAll(".opt").forEach(o => o.classList.remove("right", "wrong"));
      if (!pick) { missing = true; allRight = false; return; }
      const right = +pick.value === q.c;
      pick.parentElement.classList.add(right ? "right" : "wrong");
      if (!right) allRight = false;
    });
    const note = document.getElementById("note").value.trim();
    save.notes[l.id] = note; store();
    if (missing) { msg.className = "msg bad"; msg.textContent = "Answer every question before you turn it in."; return; }
    if (!allRight) { msg.className = "msg bad"; msg.textContent = "Not quite! Look back at the lesson and fix the answers in red."; return; }
    if (note.split(/\s+/).filter(Boolean).length < 4) { msg.className = "msg bad"; msg.textContent = "Write a full sentence about something you learned (at least 4 words)."; return; }
    save.done[l.id] = true; store();
    msg.className = "msg good";
    msg.textContent = allDone() ? "Great job! All lessons are turned in. The quiz is open!" : "Great job! Lesson turned in.";
    ti.remove();
    document.getElementById("note").disabled = true;
    main.querySelectorAll("input[type=radio]").forEach(r => r.disabled = true);
    msg.insertAdjacentHTML("afterend", `<div class="stamp">TURNED IN ✓</div>`);
    if (allDone()) document.querySelector(".lesson .row:last-child").insertAdjacentHTML("afterbegin", `<button class="btn gold" id="goQuiz">Take the quiz →</button>`),
      document.getElementById("goQuiz").onclick = quizStart;
  };
}

function quizStart() { stopTalking(); qi = 0; answers = []; quizQuestion(); }
function quizQuestion() {
  scrollTo(0, 0);
  const q = QUIZ[qi];
  main.innerHTML = `<div class="quizbox"><div class="count">Question ${qi + 1} of ${QUIZ.length}</div>
    <div class="bar"><div style="width:${qi / QUIZ.length * 100}%"></div></div>
    <div class="qt">${esc(q.q)}</div>${q.a.map((a, j) => `<label class="opt"><input type="radio" name="qq" value="${j}">${esc(a)}</label>`).join("")}
    <div class="msg bad" id="msg"></div>
    <div class="row"><button class="btn green" id="nextQ">${qi + 1 < QUIZ.length ? "Next →" : "Finish"}</button><button class="btn" id="quit">Stop the quiz</button></div></div>`;
  document.getElementById("quit").onclick = () => { if (confirm("Stop the quiz? Your answers won't count.")) home(); };
  document.getElementById("nextQ").onclick = () => {
    const pick = main.querySelector("input:checked");
    if (!pick) { document.getElementById("msg").textContent = "Pick an answer first."; return; }
    answers[qi] = +pick.value;
    if (++qi < QUIZ.length) quizQuestion(); else quizResult();
  };
}
function quizResult() {
  scrollTo(0, 0);
  const score = answers.filter((a, i) => a === QUIZ[i].c).length;
  if (save.best == null || score > save.best) save.best = score;
  store();
  const stars = score === QUIZ.length ? 3 : score >= PASS ? 2 : score >= 8 ? 1 : 0;
  let html = `<div class="quizbox" style="text-align:center"><div class="stars">${"⭐".repeat(stars)}${"☆".repeat(3 - stars)}</div>
    <div class="big">${score} of ${QUIZ.length}</div>
    <p>${score === QUIZ.length ? "PERFECT! You're a true Gold Rush expert!" : score >= PASS ? "You passed! Great work, forty-niner!" : `You need ${PASS} to pass. Look back at the lessons and try again - you can do it!`}</p>
    <div class="row" style="justify-content:center">${score >= PASS ? `<button class="btn gold" id="cert">🏅 Get my certificate</button>` : ""}<button class="btn green" id="again">Try again</button><button class="btn" id="home2">Back to lessons</button></div></div>
    <h3>Check your answers</h3><div class="review">`;
  QUIZ.forEach((q, i) => {
    const ok = answers[i] === q.c;
    html += `<div>${ok ? "✅" : "❌"} <b>${i + 1}. ${esc(q.q)}</b><br>${ok ? `Your answer: ${esc(q.a[q.c])}` : `You said: ${esc(q.a[answers[i]])} · Right answer: <b>${esc(q.a[q.c])}</b>`}</div>`;
  });
  main.innerHTML = html + "</div>";
  document.getElementById("again").onclick = quizStart;
  document.getElementById("home2").onclick = home;
  const c = document.getElementById("cert"); if (c) c.onclick = () => certificate(score);
}
function certificate(score) {
  scrollTo(0, 0);
  const today = new Date().toLocaleDateString("en-US", { year: "numeric", month: "long", day: "numeric" });
  main.innerHTML = `<div class="row noprint"><label>Your name: <input type="text" id="name" value="${esc(save.name)}" placeholder="Type your name"></label>
      <button class="btn gold" id="print">🖨️ Print</button><button class="btn" id="home3">Back to lessons</button></div>
    <div class="cert"><div style="font-size:50px">🏅</div><div style="letter-spacing:4px;font-weight:700;color:#8b5a2b">CERTIFICATE OF ACHIEVEMENT</div>
      <h2>Gold Rush Expert</h2><div>This certifies that</div><div class="who" id="who">${esc(save.name) || "&nbsp;"}</div>
      <div>finished all ${LESSONS.length} Gold Rush lessons and scored <b>${score} out of ${QUIZ.length}</b> on the Gold Rush Quiz.</div>
      <div style="margin-top:18px" class="muted">${today}</div><div style="margin-top:8px;font-family:Georgia,serif;font-style:italic">"Eureka!"</div></div>`;
  const name = document.getElementById("name");
  name.oninput = () => { save.name = name.value; store(); document.getElementById("who").textContent = name.value || " "; };
  document.getElementById("print").onclick = () => print();
  document.getElementById("home3").onclick = home;
}

home();

// ---------------------------------------------------------------- Open / Cancel / Uninstall (copies without a start-up box)
if (LAUNCH_MENU) {
  const L = document.getElementById("launch");
  let first = true;
  try { first = !sessionStorage.getItem("learning-launched"); sessionStorage.setItem("learning-launched", "1"); } catch (e) {}
  if (first) {
    L.style.display = "flex";
    L.querySelectorAll("button").forEach(b => b.onclick = () => {
      const act = b.dataset.act;
      if (act === "open") L.style.display = "none";
      else if (act === "cancel") { window.close(); document.getElementById("launchMsg").textContent = "You can close this window now."; }
      else document.getElementById("launchMsg").innerHTML = "To uninstall: right-click <b>Gold Rush Learning</b> in the Launcher &gt; <b>Uninstall</b>, then delete its folder from My files.";
    });
  }
}
