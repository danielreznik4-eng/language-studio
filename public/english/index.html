<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>English Coach</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#1d2333;--muted:#6b7385;--line:#dfe3ec;--acc:#2f6fed;--acc2:#e8f0ff;--good:#1f9d55;--bad:#d64545;--key:#eef1f7}
@media (prefers-color-scheme:dark){:root{--bg:#12151d;--card:#1b202b;--ink:#e8ebf2;--muted:#9aa3b5;--line:#2c3342;--acc:#6b9bff;--acc2:#22304d;--good:#4cc27a;--bad:#ff7070;--key:#242b39}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Segoe UI",system-ui,sans-serif}
header{display:flex;align-items:center;gap:16px;padding:14px 20px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;flex-wrap:wrap}
header h1{font-size:20px;margin:0;white-space:nowrap}
header .xp{margin-left:auto;color:var(--muted);font-size:14px;display:flex;gap:10px;align-items:center}
nav{display:flex;gap:6px;flex-wrap:wrap}
nav button{border:0;background:transparent;color:var(--ink);padding:8px 12px;border-radius:8px;cursor:pointer;font:inherit;font-size:15px}
nav button.on{background:var(--acc);color:#fff}
nav button:hover:not(.on){background:var(--acc2)}
main{max-width:980px;margin:0 auto;padding:20px 16px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
h2{margin:0 0 6px;font-size:22px} h3{margin:14px 0 6px}
.muted{color:var(--muted)}
textarea,input[type=text],select{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
textarea{min-height:120px;resize:vertical}
input[type=range]{width:100%}
.btn{border:0;background:var(--acc);color:#fff;padding:9px 16px;border-radius:10px;cursor:pointer;font:inherit}
.btn.ghost{background:var(--acc2);color:var(--ink)}
.btn.danger{background:var(--bad)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:700px){.grid2{grid-template-columns:1fr}}
.letters{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.letter{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center;cursor:pointer}
.letter b{font-size:30px;display:block}
.letter small{color:var(--muted)}
.topics{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:6px 12px;border-radius:20px;cursor:pointer;font:inherit;font-size:14px}
.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.flash{min-height:180px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;user-select:none}
.flash .big{font-size:40px;font-weight:600}
.ok{color:var(--good);font-weight:600} .no{color:var(--bad);font-weight:600}
.typing{font:22px/1.7 Consolas,monospace;letter-spacing:1px;background:var(--bg);border-radius:10px;padding:14px;min-height:80px;word-break:break-word}
.typing .d{color:var(--good)} .typing .x{color:#fff;background:var(--bad);border-radius:3px} .typing .c{border-bottom:3px solid var(--acc)}
.kb{display:flex;flex-direction:column;gap:6px;align-items:center;margin-top:14px}
.kb div{display:flex;gap:6px}
.k{width:46px;height:46px;border-radius:8px;background:var(--key);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:16px;font-weight:600}
.k i{font-style:normal;font-size:11px;color:var(--muted);font-weight:400}
.k.hl{background:var(--acc);color:#fff} .k.hl i{color:#dbe6ff}
.k.home{box-shadow:inset 0 -3px 0 var(--good)}
.k.space{width:280px}
@media (max-width:600px){.k{width:28px;height:36px;font-size:12px}.k.space{width:160px}.k i{font-size:9px}}
.lessonlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.lessonlist button{text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;color:var(--ink);font:inherit}
.lessonlist button .s{float:right}
.ex{display:flex;flex-direction:column;gap:10px}
.words{display:flex;gap:8px;flex-wrap:wrap;min-height:44px;padding:8px;border:1px dashed var(--line);border-radius:10px}
.w{background:var(--acc2);padding:6px 12px;border-radius:8px;cursor:pointer;border:0;color:var(--ink);font:inherit}
table{border-collapse:collapse;width:100%} td,th{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left}
.speak{border:0;background:none;cursor:pointer;font-size:18px;color:var(--acc)}
.pathunit{margin:18px 0 8px;font-weight:700;color:var(--muted);text-transform:uppercase;font-size:13px;letter-spacing:.5px}
.steps{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.stepbtn{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;color:var(--ink);font:inherit;display:flex;gap:10px;align-items:center}
.stepbtn .ic{font-size:20px;width:28px;text-align:center}
.stepbtn.cur{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc2)}
.stepbtn.lock{opacity:.5;cursor:default}
.lcard{min-height:220px;display:flex;flex-direction:column;justify-content:center;gap:10px}
.lcard .big{font-size:44px;font-weight:700}
.lcard .ex{display:flex;flex-direction:column;gap:6px;background:var(--bg);border-radius:10px;padding:10px 12px}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.opt{border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:14px;border-radius:12px;font:inherit;font-size:18px;cursor:pointer}
.opt.good{background:var(--good);color:#fff;border-color:var(--good)} .opt.badx{background:var(--bad);color:#fff;border-color:var(--bad)}
.fb{padding:12px 14px;border-radius:10px;margin-top:6px} .fb.ok{background:rgba(31,157,85,.12)} .fb.no{background:rgba(214,69,69,.12)}
.bar{height:10px;background:var(--bg);border-radius:6px;overflow:hidden} .bar>div{height:100%;background:var(--good)}
.profiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.profile{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:16px;cursor:pointer;text-align:left;color:var(--ink);font:inherit}
.profile .flag{font-size:30px}
label{display:block;font-weight:600;margin:12px 0 4px}
.rutip{position:fixed;right:16px;bottom:16px;z-index:20;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:0 8px 30px rgba(0,0,0,.18);display:none;max-width:calc(100vw - 32px)}
.rutip.show{display:block}
.rutip .hd{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;margin-bottom:8px}
.rutip .hd button{border:0;background:var(--acc2);color:var(--ink);border-radius:6px;cursor:pointer;padding:2px 8px;font:inherit}
.rutip .r{display:flex;gap:4px;margin-bottom:4px}
.rutip .r:nth-child(3){padding-left:12px}.rutip .r:nth-child(4){padding-left:24px}
.rutip .q{width:30px;height:34px;border-radius:6px;background:var(--key);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:600;font-size:15px;line-height:1}
.rutip .q i{font-style:normal;font-size:9px;color:var(--muted);font-weight:400;margin-top:2px}
.rutip .q.hit{background:var(--good);color:#fff}
.rutip.mini .r{display:none}
@media (max-width:600px){.rutip .q{width:22px;height:28px;font-size:12px}}
</style>
</head>
<body>
<header>
  <h1>📘 <span id="appname">English Coach</span></h1>
  <nav id="nav"></nav>
  <div class="xp"><span id="xp"></span><button class="btn ghost" id="who" style="padding:5px 10px"></button></div>
</header>
<main id="app"></main>
<div class="rutip" id="rutip"></div>

<script src="/english/data.js"></script>
<script>
"use strict";
// ================================================================ profiles ("accounts")
// mode "ru2en": Russian speaker learning English (Russian menus).
// mode "en2ru": English speaker learning Russian (English menus).
const ls = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
let profiles = ls.get("ec-profiles", null);
if(!profiles){
  profiles = [];
  const old = ls.get("ec", null);   // data from the first version
  if(old){ profiles.push({id:"p1", name:"Ученик", mode:"ru2en"}); ls.set("ec:p1", old); }
  ls.set("ec-profiles", profiles);
}
let P = null, S = null;   // current profile and its saved data
function blank(){ return {xp:0, path:{}, known:{}, grammar:{}, typing:{}, best:0, rate:.6, rateV:2, voice:"", autoplay:true}; }
function useProfile(id){
  P = profiles.find(p => p.id === id) || null;
  S = P ? Object.assign(blank(), ls.get("ec:" + P.id, {})) : null;
  if(S && ls.get("ec:" + P.id, {}).rateV !== 2){ if(S.rate >= .85) S.rate = .6; S.rateV = 2; save(); }   // old default was too fast
  if(S){   // first-version progress used plain keys; give them the mode prefix
    for(const part of ["known","grammar","typing"]) for(const k of Object.keys(S[part]))
      if(!k.startsWith("ru2en") && !k.startsWith("en2ru")){ S[part][(part === "known" ? P.mode + ":" : P.mode) + k] = S[part][k]; delete S[part][k]; }
  }
  ls.set("ec-current", P ? P.id : "");
  page = "path"; render();
}
function save(){ if(P) ls.set("ec:" + P.id, S); }
const RU = () => !P || P.mode === "ru2en";          // menus in Russian?
const T = (ru, en) => RU() ? ru : en;                 // pick menu text
const TARGET = () => RU() ? "en-US" : "ru-RU";        // the language being learned

function addXP(n){ S.xp += n; save(); drawXP(); }
function drawXP(){
  $("xp").textContent = P ? "⭐ " + S.xp + T(" опыта · уровень ", " XP · level ") + (1 + Math.floor(S.xp/100)) : "";
  $("who").textContent = P ? (P.mode === "ru2en" ? "🇷🇺→🇬🇧 " : "🇬🇧→🇷🇺 ") + P.name : "";
  $("who").style.display = P ? "" : "none";
  $("appname").textContent = P && P.mode === "en2ru" ? "Russian Coach" : "English Coach";
  document.title = $("appname").textContent;
}

// ================================================================ speech
function voices(lang){ try{ return speechSynthesis.getVoices().filter(v => v.lang.replace("_","-").toLowerCase().startsWith(lang.slice(0,2))); }catch(e){ return []; } }
function say(text, lang){
  try{
    lang = lang || TARGET();
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text); u.lang = lang; u.rate = S ? S.rate : .6;
    const v = voices(lang).find(v => v.name === (S && S.voice)) || voices(lang)[0];
    if(v) u.voice = v;
    speechSynthesis.speak(u);
  }catch(e){}
}
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $ = id => document.getElementById(id);
const sayBtn = (text) => `<button class="speak" data-say="${esc(text)}">🔊</button>`;
document.addEventListener("click", e => { const b = e.target.closest("[data-say]"); if(b) say(b.dataset.say); });

// lesson content lives in data.js
const topicName = k => { const [en, ru] = k.split("|"); return T(ru, en[0].toUpperCase() + en.slice(1)); };

// pick content for the current mode
const ALPHA = () => RU() ? ALPHABET_EN : ALPHABET_RU;
const GRAMMAR = () => RU() ? GRAMMAR_EN : GRAMMAR_RU;
const TYPING = () => RU() ? TYPING_EN : TYPING_RU;
// a word in the language being learned, its meaning in your language, and how to say it
const learn = ([en, ru, tr]) => RU() ? {word:en, mean:ru, sound:tr} : {word:ru, mean:en, sound:translit(ru)};

// ================================================================ pages
const PAGES = {
 path: {n:() => T("🧭 По шагам","🧭 Step by step"), draw: drawPath},
 home: {n:() => T("Главная","Home"), draw: drawHome},
 tr: {n:() => T("Переводчик","Translator"), draw: drawTranslator},
 abc: {n:() => T("Алфавит","Alphabet"), draw: drawAlphabet},
 read: {n:() => T("Чтение","Reading"), draw: drawReading},
 words: {n:() => T("Слова","Words"), draw: drawWords},
 spell: {n:() => T("Правописание","Spelling"), draw: drawSpelling},
 write: {n:() => T("Грамматика и письмо","Grammar & writing"), draw: drawGrammar},
 type: {n:() => T("Печать","Typing"), draw: drawTyping},
 set: {n:() => T("⚙ Настройки","⚙ Settings"), draw: drawSettings}
};
let page = "home";
function go(p){ page = p; render(); window.scrollTo(0,0); }
function render(){
  if(window._typeKey){ document.removeEventListener("keydown", window._typeKey); window._typeKey = null; }
  if(!P){ $("nav").innerHTML = ""; drawXP(); return drawProfiles($("app")); }
  document.documentElement.lang = RU() ? "ru" : "en";
  $("nav").innerHTML = Object.entries(PAGES).map(([k,v]) => `<button class="${k===page?"on":""}" data-go="${k}">${v.n()}</button>`).join("");
  $("app").innerHTML = ""; PAGES[page].draw($("app")); drawXP();
}
document.addEventListener("click", e => { const b = e.target.closest("[data-go]"); if(b) go(b.dataset.go); });
$("who").onclick = () => { P = null; S = null; ls.set("ec-current", ""); render(); };

// ---------------------------------------------------------------- profiles
function drawProfiles(el){
  el.innerHTML = `<div class="card"><h2>Кто учится? · Who is learning?</h2>
   <p class="muted">У каждого свой аккаунт и свой прогресс. · Everyone has their own account and progress.</p>
   <div class="profiles">${profiles.map(p => `<button class="profile" data-p="${p.id}"><div class="flag">${p.mode==="ru2en"?"🇷🇺 → 🇬🇧":"🇬🇧 → 🇷🇺"}</div><b>${esc(p.name)}</b><br>
     <span class="muted">${p.mode==="ru2en"?"Учит английский":"Learning Russian"} · ⭐ ${ls.get("ec:"+p.id,{}).xp||0}</span></button>`).join("")}</div></div>
   <div class="card"><h3>Новый аккаунт · New account</h3>
    <label>Имя · Name</label><input type="text" id="pn" maxlength="24" placeholder="Имя / Name">
    <div class="row" style="margin-top:12px">
     <button class="btn" data-new="ru2en">🇷🇺 → 🇬🇧 Я говорю по-русски, учу английский</button>
     <button class="btn" data-new="en2ru">🇬🇧 → 🇷🇺 I speak English, learning Russian</button></div></div>`;
  el.querySelectorAll("[data-p]").forEach(b => b.onclick = () => useProfile(b.dataset.p));
  el.querySelectorAll("[data-new]").forEach(b => b.onclick = () => {
    const mode = b.dataset.new, name = $("pn").value.trim() || (mode === "ru2en" ? "Ученик" : "Learner");
    const id = "p" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    profiles.push({id, name, mode}); ls.set("ec-profiles", profiles); useProfile(id);
  });
}

// ---------------------------------------------------------------- home
function drawHome(el){
  const totalWords = Object.values(VOCAB).flat().length, known = Object.keys(S.known).length;
  const gDone = Object.keys(S.grammar).length, tDone = Object.keys(S.typing).length;
  el.innerHTML = `
  <div class="card"><h2>${T("Привет, " + esc(P.name) + "! 👋 Учим английский", "Hi " + esc(P.name) + "! 👋 Let's learn Russian")}</h2>
   <p class="muted">${T("Здесь ты научишься читать, писать, печатать и понимать английский. Начни с алфавита, потом учи слова и грамматику. Всё сохраняется само.",
     "Learn to read, write, type and understand Russian. Start with the alphabet, then words and grammar. Everything saves by itself.")}</p></div>
  <div class="grid2">
   ${stat(T("Слова выучены","Words learned"), known, totalWords)}${stat(T("Уроки грамматики","Grammar lessons"), gDone, GRAMMAR().length)}
   ${stat(T("Уроки печати","Typing lessons"), tDone, TYPING().length)}<div class="card"><h3>${T("Рекорд печати","Typing record")}</h3><div style="font-size:32px;font-weight:700">${S.best||0} <span class="muted" style="font-size:16px">${T("слов в минуту","words per minute")}</span></div></div>
  </div>
  <div class="card"><h3>${T("План на каждый день (15 минут)","Daily plan (15 minutes)")}</h3>
   <ol><li>${T("5 минут — карточки со словами","5 minutes — word cards")}</li><li>${T("5 минут — один урок грамматики","5 minutes — one grammar lesson")}</li><li>${T("5 минут — печать","5 minutes — typing")}</li></ol>
   <div class="row"><button class="btn" data-go="abc">${T("Начать с алфавита","Start with the alphabet")}</button><button class="btn ghost" data-go="words">${T("Учить слова","Learn words")}</button><button class="btn ghost" data-go="tr">${T("Перевести текст","Translate text")}</button></div></div>`;
}
function stat(name, a, b){ const p = b ? Math.round(a*100/b) : 0;
  return `<div class="card"><h3>${name}</h3><div style="font-size:28px;font-weight:700">${a} / ${b}</div><div class="bar"><div style="width:${p}%"></div></div></div>`; }

// ---------------------------------------------------------------- settings
function drawSettings(el){
  const vs = voices(TARGET());
  el.innerHTML = `<div class="card"><h2>${T("Настройки","Settings")}</h2>
   <label>${T("Скорость произношения","Pronunciation speed")}: <span id="rv">${S.rate.toFixed(2)}×</span></label>
   <input type="range" id="rate" min="0.2" max="1.4" step="0.05" value="${S.rate}">
   <div class="row muted" style="justify-content:space-between;font-size:13px"><span>${T("медленно","slow")}</span><span>${T("обычно","normal")}</span><span>${T("быстро","fast")}</span></div>
   <label>${T("Голос","Voice")}</label>
   <select id="voice">${vs.length ? vs.map(v => `<option ${v.name===S.voice?"selected":""}>${esc(v.name)}</option>`).join("") : `<option>${T("Голос по умолчанию","Default voice")}</option>`}</select>
   <div class="row" style="margin-top:10px"><button class="btn ghost" id="test">🔊 ${T("Проверить","Test")}</button></div>
   <label><input type="checkbox" id="auto" ${S.autoplay?"checked":""}> ${T("Произносить слово, когда переворачиваешь карточку","Say the word when you flip a card")}</label></div>
  <div class="card"><h3>${T("Аккаунт","Account")}</h3>
   <label>${T("Имя","Name")}</label><input type="text" id="nm" maxlength="24" value="${esc(P.name)}">
   <div class="row" style="margin-top:12px"><button class="btn ghost" id="sw">${T("Сменить аккаунт","Switch account")}</button>
    <button class="btn ghost" id="rs">${T("Сбросить прогресс","Reset progress")}</button><button class="btn danger" id="del">${T("Удалить аккаунт","Delete account")}</button></div></div>`;
  $("rate").oninput = () => { S.rate = +$("rate").value; $("rv").textContent = S.rate.toFixed(2) + "×"; save(); };
  $("rate").onchange = () => say(RU() ? "Hello, how are you?" : "Привет, как дела?");
  $("voice").onchange = () => { S.voice = $("voice").value; save(); say(RU() ? "Hello" : "Привет"); };
  $("test").onclick = () => say(RU() ? "A, B, C. Hello, how are you?" : "А, Б, В. Привет, как дела?");
  $("auto").onchange = () => { S.autoplay = $("auto").checked; save(); };
  $("nm").onchange = () => { P.name = $("nm").value.trim() || P.name; ls.set("ec-profiles", profiles); drawXP(); };
  $("sw").onclick = () => $("who").click();
  $("rs").onclick = () => { if(confirm(T("Сбросить весь прогресс?","Reset all progress?"))){ const keep = {rate:S.rate, voice:S.voice, autoplay:S.autoplay}; S = Object.assign(blank(), keep); save(); render(); } };
  $("del").onclick = () => { if(confirm(T("Удалить аккаунт «" + P.name + "»?","Delete account \"" + P.name + "\"?"))){
    try{ localStorage.removeItem("ec:" + P.id); }catch(e){}
    profiles = profiles.filter(p => p !== P); ls.set("ec-profiles", profiles); P = null; S = null; render(); } };
}
try{ speechSynthesis.onvoiceschanged = () => { if(page === "set" && P) render(); }; }catch(e){}

// ---------------------------------------------------------------- translator
const DICT = (() => { const m = {}; Object.values(VOCAB).flat().forEach(([en,ru]) => { m[en.toLowerCase()] = ru; m[ru.toLowerCase()] = en; }); return m; })();
function drawTranslator(el){
  const RUS = T("Русский","Russian"), ENG = T("Английский","English");
  let fromRu = RU();
  el.innerHTML = `<div class="card"><h2>${T("Переводчик","Translator")}</h2>
   <p class="muted">${T("Нужен интернет для перевода предложений. Без интернета переводятся отдельные слова из уроков.","Sentences need internet. Without internet, single words from the lessons still work.")}</p>
   <div class="row" style="margin-bottom:10px"><b id="fromL"></b><button class="btn ghost" id="swap">⇄</button><b id="toL"></b></div>
   <div class="grid2"><textarea id="src" placeholder="${T("Напиши текст...","Type text...")}"></textarea><textarea id="dst" readonly placeholder="${T("Перевод","Translation")}"></textarea></div>
   <div class="row" style="margin-top:10px"><button class="btn" id="go">${T("Перевести","Translate")} (Ctrl+Enter)</button><button class="btn ghost" id="sp">🔊 ${T("Послушать","Listen")}</button><span id="st" class="muted"></span></div></div>`;

  const step = () => {
    if(k >= items.length) return finish();
    if(g.ex){
      const [q,a] = items[k];
      ex.innerHTML = `<p class="muted">${T("Задание","Task")} ${k+1} ${T("из","of")} ${items.length}: ${T("впиши пропущенное слово","fill in the missing word")}</p><div style="font-size:22px">${esc(q).replace("___","<u>&nbsp;?&nbsp;</u>")}</div>
        <input type="text" id="ga" autocomplete="off" spellcheck="false" placeholder="${T("Ответ и Enter","Answer and Enter")}"><p id="gr"></p>`;
      ruBox($("ga"), /[а-яё]/i.test(a)); $("ga").focus();
      $("ga").onkeydown = e => { if(e.key !== "Enter") return;
        let v = $("ga").value.trim().toLowerCase().replace("’","'");
        if(!RU() && /[a-z]/.test(v) && /[а-яё]/.test(a)) v = [...v].map(c => RU_KEYS[c] || c).join("");
        if(v.replace(/ё/g,"е") === a.replace(/ё/g,"е")){ $("gr").innerHTML = `<span class="ok">${T("Верно!","Correct!")}</span>`;
          if(/[а-яё]/.test(a) || RU()) say(RU() ? q.replace("___", a).replace(/\(.*?\)/g,"") : a); k++; setTimeout(step, 800); }
        else { mistakes++; $("gr").innerHTML = `<span class="no">${T("Нет. Правильно:","No. Correct answer:")} <b>${esc(a)}</b></span>`; } };
    } else {
      const [sent, mean] = items[k]; const words = sent.split(" "); const shuffled = [...words].sort(() => Math.random() - .5); let built = [];
      ex.innerHTML = `<p class="muted">${T("Задание","Task")} ${k+1} ${T("из","of")} ${items.length}: ${T("собери предложение","build the sentence")}</p><p style="font-size:20px">«${esc(mean)}»</p>
        <div class="words" id="built"></div><div class="words" id="pool"></div><div class="row"><button class="btn ghost" id="clr">${T("Сбросить","Clear")}</button><button class="btn" id="chk">${T("Проверить","Check")}</button></div><p id="gr"></p>`;
      const draw = () => { $("built").innerHTML = built.map(w => `<button class="w">${esc(w)}</button>`).join("");
        const left = [...shuffled]; built.forEach(w => left.splice(left.indexOf(w),1));
        $("pool").innerHTML = left.map(w => `<button class="w">${esc(w)}</button>`).join("");
        [...$("pool").children].forEach(b => b.onclick = () => { built.push(b.textContent); draw(); });
        [...$("built").children].forEach((b,i) => b.onclick = () => { built.splice(i,1); draw(); }); };
      $("clr").onclick = () => { built = []; draw(); };
      $("chk").onclick = () => { if(built.join(" ") === sent){ $("gr").innerHTML = `<span class="ok">${T("Отлично!","Great!")}</span>`; say(sent); k++; setTimeout(step, 1000); }
        else { mistakes++; $("gr").innerHTML = `<span class="no">${T("Порядок неверный. Помни: кто → что делает → что → где → когда.","Wrong order. Remember: who → does → what → where → when.")}</span>`; } };
      draw();
    }
  };
  step();
}

     <div class="lessonlist">${TY.map((t,i) => `<button data-ti="${i}"><span class="s">${S.typing[P.mode+i]?S.typing[P.mode+i]+T(" сл/мин"," wpm"):""}</span><b>${i+1}.</b> ${t.t}</button>`).join("")}</div></div>`;
    el.querySelectorAll("[data-ti]").forEach(b => b.onclick = () => { ti = +b.dataset.ti; go("type"); });

  }

    <div class="typing" id="tt"></div><p id="tst" class="muted">${T("Начни печатать...","Start typing...")}</p><div class="kb" id="kb"></div></div>`;
  $("back").onclick = () => { ti = -1; go("type"); };
  const rows = RU() ? ["qwertyuiop","asdfghjkl;","zxcvbnm"] : ["qwertyuiop[]","asdfghjkl;'","zxcvbnm,."];
  // ru2en: English letter big, Russian small. en2ru: Russian letter big, English small.
  $("kb").innerHTML = rows.map(r => `<div>${[...r].map(c => { const big = RU() ? c.toUpperCase() : (RU_KEYS[c]||c).toUpperCase(), small = RU() ? (RU_KEYS[c]||"") : c.toUpperCase();
      const id = RU() ? c : (RU_KEYS[c]||c);
      return `<span class="k ${"fj".includes(c)?"home":""}" data-k="${esc(id)}">${esc(big)}<i>${esc(small)}</i></span>`; }).join("")}</div>`).join("")
    + `<div><span class="k space" data-k=" ">${T("пробел","space")}</span></div>`;
  const text = L.text; let pos = 0, start = 0; const wrong = new Set();
  const draw = () => {
    $("tt").innerHTML = [...text].map((c,i) => `<span class="${i<pos?(wrong.has(i)?"x":"d"):i===pos?"c":""}">${c===" "?"&nbsp;":esc(c)}</span>`).join("");
    document.querySelectorAll(".k").forEach(k => k.classList.toggle("hl", pos < text.length && k.dataset.k === text[pos].toLowerCase()));
  };
  const onKey = e => {
    if(e.key.length !== 1 || e.ctrlKey || e.altKey) return;
    e.preventDefault();
    let ch = e.key;
    if(RU() && /[а-яё]/i.test(ch)){ $("tst").innerHTML = '<span class="no">Русская раскладка! Нажми Alt+Shift.</span>'; return; }
    if(!RU() && /[a-z;'\[\],.]/i.test(ch) && /[а-яё]/i.test(text[pos])){   // English layout -> Russian letter on that key
      const r = RU_KEYS[ch.toLowerCase()]; if(r) ch = ch === ch.toUpperCase() && /[a-z]/i.test(ch) ? r.toUpperCase() : r;
    }
    if(!start) start = Date.now();
    if(ch !== text[pos]) wrong.add(pos);
    pos++; draw();
    if(pos >= text.length){
      document.removeEventListener("keydown", onKey); window._typeKey = null;
      const min = (Date.now() - start) / 60000, wpm = Math.round((text.length / 5) / Math.max(min, 1/60));
      const acc = Math.round(100 * (text.length - wrong.size) / text.length);
      $("tst").innerHTML = `<span class="ok">${T("Готово!","Done!")} ${wpm} ${T("слов в минуту, точность","wpm, accuracy")} ${acc}%</span> <button class="btn" id="re">${T("Ещё раз","Again")}</button> <button class="btn ghost" id="nx">${T("Дальше","Next")}</button>`;
      $("re").onclick = () => go("type"); $("nx").onclick = () => { ti = ti + 1 < TY.length ? ti + 1 : -1; go("type"); };
      if(acc >= 90 && (!S.typing[P.mode+ti] || wpm > S.typing[P.mode+ti])) S.typing[P.mode+ti] = wpm;
      if(wpm > (S.best||0)) S.best = wpm;
      addXP(acc >= 90 ? 10 : 3);
    } else $("tst").textContent = T("Ошибок: ","Mistakes: ") + wrong.size;
  };
  window._typeKey = onKey;
  document.addEventListener("keydown", onKey);
  draw();
}

// ================================================================ Russian typing in text boxes
// Boxes marked data-ru="1" turn English key presses into the Russian letter on the same key,
// and a keyboard tooltip shows in the corner while one is focused.
function drawTip(){
  const mini = ls.get("ec-tipmini", false), tip = $("rutip");
  tip.classList.toggle("mini", mini);
  tip.innerHTML = `<div class="hd"><b>${T("⌨ Русские буквы включены","⌨ Russian letters on")}</b><span class="muted">${T("просто печатай","just type")}</span><button id="tipmin">${mini ? "▲" : "▼"}</button></div>`
    + ["`qwertyuiop[]", "asdfghjkl;'", "zxcvbnm,."].map(r => `<div class="r">${[...r].map(c =>
        `<span class="q" data-q="${esc(c)}">${esc((RU_KEYS[c] || c).toUpperCase())}<i>${esc(c.toUpperCase())}</i></span>`).join("")}</div>`).join("");
  $("tipmin").onmousedown = e => { e.preventDefault(); ls.set("ec-tipmini", !mini); drawTip(); };
}
function ruBox(el, on){
  if(!el) return;
  el.dataset.ru = on ? "1" : "";
  if(el === document.activeElement){ if(on) drawTip(); $("rutip").classList.toggle("show", !!on); }
}
document.addEventListener("focusin", e => { const on = !!(e.target.dataset && e.target.dataset.ru === "1"); if(on) drawTip(); $("rutip").classList.toggle("show", on); });
document.addEventListener("focusout", () => setTimeout(() => {
  const a = document.activeElement; if(!(a && a.dataset && a.dataset.ru === "1")) $("rutip").classList.remove("show"); }, 0));
document.addEventListener("keydown", e => {
  const el = e.target;
  if(!el.dataset || el.dataset.ru !== "1" || e.ctrlKey || e.altKey || e.metaKey || e.key.length !== 1) return;
  const low = e.key.toLowerCase(), r = RU_KEYS[low];
  if(!r) return;   // already a Russian letter (Russian layout) or a key with no Russian letter
  e.preventDefault();
  const ch = e.key !== low ? r.toUpperCase() : r;
  const s = el.selectionStart, end = el.selectionEnd;
  el.value = el.value.slice(0, s) + ch + el.value.slice(end);
  el.selectionStart = el.selectionEnd = s + 1;
  el.dispatchEvent(new Event("input", {bubbles: true}));
  const q = document.querySelector(`.rutip .q[data-q="${CSS.escape(low)}"]`);
  if(q){ q.classList.add("hit"); setTimeout(() => q.classList.remove("hit"), 250); }
}, true);

// ================================================================ step-by-step path
// Small lessons in order. Each: explanation cards one at a time, then practice with an explanation for every answer.
// Wrong answers come back at the end. Finishing a step unlocks the next one.
const PATH = () => RU() ? PATH_RU2EN : PATH_EN2RU;
const flatSteps = () => PATH().flatMap(u => u.steps.map(s => Object.assign({unit: u.u}, s)));
const stepId = i => P.mode + ":" + i;
const stepDone = i => !!S.path[stepId(i)];
const shuffle = a => { a = a.slice(); for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const norm = s => String(s).trim().toLowerCase().replace(/[’`]/g, "'").replace(/ё/g, "е").replace(/[.!?]+$/, "");

function letterInfo(L){
  if(RU()){ const a = ALPHABET_EN.find(x => x[0] === L); return {big: L + " " + L.toLowerCase(), name: a[1], word: a[2], sound: a[3], say: L + ". " + a[2]}; }
  const a = ALPHABET_RU.find(x => x[0].startsWith(L)); return {big: a[0], name: a[1], sound: a[2], word: a[3], mean: a[4], say: L + ". " + a[3]};
}

function buildCards(s){
  const cards = [];
  if(s.intro) cards.push(Cd(s.t, s.intro));
  if(s.k === "letters") s.letters.forEach(L => { const i = letterInfo(L);
    cards.push({letter:L, h:i.big, p: RU() ? `Называется «${i.name}». Пример: ${i.word} [${i.sound}]` : `Name: "${i.name}". Sounds like: ${i.sound}. Example: ${i.word} = ${i.mean}`, say:i.say}); });
  if(s.k === "words") VOCAB[VKEY(s.topic)].slice(s.from, s.to).map(learn).forEach(w =>
    cards.push({h:w.word, p:`[${w.sound}] — ${w.mean}`, say:w.word, word:true}));
  if(s.k === "rule") cards.push(...s.cards);
  return cards;
}

function buildExercises(s){
  if(s.k === "rule") return s.ex.slice();
  const ex = [];
  if(s.k === "letters"){
    const pool = s.letters;
    pool.forEach(L => { const i = letterInfo(L);
      const others = shuffle(pool.filter(x => x !== L)).slice(0, 3);
      ex.push(Li(L, shuffle([L, ...others]), L, T(`Это буква ${L} («${i.name}»).`, `That was ${L} ("${i.name}").`)));
      const names = shuffle([i.name, ...others.map(o => letterInfo(o).name)]);
      ex.push(Ch(T(`Как называется буква ${L}?`, `What is the name of ${L}?`), names, i.name, T(`${L} называется «${i.name}».`, `${L} is called "${i.name}".`)));
    });
    return shuffle(ex);
  }
  const words = VOCAB[VKEY(s.topic)].slice(s.from, s.to).map(learn);
  words.forEach(w => {
    const others = shuffle(words.filter(x => x !== w)).slice(0, 3);
    ex.push(Ch(T(`Что значит «${w.word}»?`, `What does "${w.word}" mean?`), shuffle([w.mean, ...others.map(o => o.mean)]), w.mean, `${w.word} = ${w.mean}`));
    ex.push(Li(w.word, shuffle([w.word, ...others.map(o => o.word)]), w.word, `${w.word} [${w.sound}]`));
  });
  shuffle(words).slice(0, 3).forEach(w => ex.push(Ty(T(`Напиши по-английски: ${w.mean}`, `Write in Russian: ${w.mean}`), w.word, `${w.mean} = ${w.word}`)));
  return ex;
}

function drawPath(el){
  const steps = flatSteps();
  let firstOpen = steps.findIndex((s, i) => !stepDone(i)); if(firstOpen < 0) firstOpen = steps.length;
  const done = steps.filter((s, i) => stepDone(i)).length;
  const pct = Math.round(done * 100 / steps.length);
  let html = `<div class="card"><h2>${T("Учимся шаг за шагом","Learn step by step")}</h2>
    <p class="muted">${T("Маленькие уроки по порядку. В каждом сначала короткое объяснение, потом упражнения. Пройди шаг — откроется следующий.",
      "Small lessons in order. Each has a short explanation first, then practice. Finish a step to unlock the next one.")}</p>
    <div class="row muted" style="justify-content:space-between"><span>${T("Пройдено шагов","Steps done")}: ${done} / ${steps.length}</span><span>${pct}%</span></div>
    <div class="bar"><div style="width:${pct}%"></div></div>
    ${firstOpen < steps.length ? `<div class="row" style="margin-top:12px"><button class="btn" data-step="${firstOpen}">▶ ${T("Продолжить","Continue")}: ${esc(steps[firstOpen].t)}</button></div>` : `<p class="ok">${T("Все шаги пройдены! 🎉","All steps done! 🎉")}</p>`}</div>`;
  let i = 0;
  for(const u of PATH()){
    html += `<div class="pathunit">${esc(u.u)}</div><div class="steps">`;
    for(const s of u.steps){
      const stars = S.path[stepId(i)] || 0, locked = i > firstOpen, cur = i === firstOpen;
      html += `<button class="stepbtn ${cur ? "cur" : ""} ${locked ? "lock" : ""}" ${locked ? "disabled" : `data-step="${i}"`}>
        <span class="ic">${locked ? "🔒" : stars ? "⭐" : cur ? "▶" : "○"}</span><span><b>${i + 1}.</b> ${esc(s.t)}${stars ? ` <span class="muted">${"★".repeat(stars)}</span>` : ""}</span></button>`;
      i++;
    }
    html += `</div>`;
  }
  el.innerHTML = html;
  el.querySelectorAll("[data-step]").forEach(b => b.onclick = () => runStep(el, +b.dataset.step));
}

function runStep(el, index){
  const s = flatSteps()[index], cards = buildCards(s);
  let ci = 0;
  window.scrollTo(0, 0);
  const learnView = () => {
    const c = cards[ci];
    el.innerHTML = `<div class="card"><div class="row" style="justify-content:space-between"><button class="btn ghost" id="quit">← ${T("Все шаги","All steps")}</button>
      <span class="muted">${T("Объяснение","Explanation")} ${ci + 1} / ${cards.length}</span></div>
      <div class="bar" style="margin:12px 0"><div style="width:${Math.round((ci + 1) * 100 / (cards.length + 1))}%"></div></div>
      <div class="lcard">
        ${c.letter || c.word ? `<div class="big">${esc(c.h)} ${sayBtn(c.say)}</div>` : `<h2>${esc(c.h)}</h2>`}
        <p style="font-size:18px">${esc(c.p)}</p>
        ${(c.ex || []).length ? `<div class="ex">${c.ex.map(([a, b]) => `<div><b>${esc(a)}</b> ${sayBtn(a.split(" → ").pop().replace(/\s*\(.*\)$/, ""))} <span class="muted">— ${esc(b)}</span></div>`).join("")}</div>` : ""}
      </div>
      <div class="row" style="justify-content:flex-end"><button class="btn ghost" id="prev" ${ci === 0 ? "disabled" : ""}>←</button>
      <button class="btn" id="next">${ci + 1 < cards.length ? T("Дальше →","Next →") : T("К упражнениям →","Start practice →")}</button></div></div>`;
    $("quit").onclick = () => go("path");
    $("prev").onclick = () => { ci--; learnView(); };
    $("next").onclick = () => { if(ci + 1 < cards.length){ ci++; learnView(); } else practice(); };
    if(c.say && S.autoplay) say(c.say);
  };
  const practice = () => {
    const queue = buildExercises(s); const total = queue.length; let solved = 0, mistakes = 0; const retried = new Set();
    const next = () => {
      if(!queue.length) return finish(mistakes);
      const e = queue.shift();
      el.innerHTML = `<div class="card"><div class="row" style="justify-content:space-between"><button class="btn ghost" id="quit">← ${T("Все шаги","All steps")}</button>
        <span class="muted">${T("Упражнение","Exercise")} ${Math.min(solved + 1, total)} / ${total}</span></div>
        <div class="bar" style="margin:12px 0"><div style="width:${Math.round(solved * 100 / total)}%"></div></div>
        <div id="exbody" class="ex" style="gap:12px"></div><div id="fb"></div></div>`;
      $("quit").onclick = () => go("path");
      const body = $("exbody");
      const answer = (given, btn) => {
        const want = [].concat(e.a), ok = e.type === "order" ? given === e.sentence : want.some(w => norm(w) === norm(given));
        body.querySelectorAll("button, input").forEach(x => x.disabled = true);
        if(btn) btn.classList.add(ok ? "good" : "badx");
        if(!ok && (e.type === "choose" || e.type === "listen")) body.querySelectorAll(".opt").forEach(b => { if(norm(b.textContent) === norm(want[0])) b.classList.add("good"); });
        let again = false;
        if(ok){ solved++; } else { mistakes++; if(!retried.has(e)){ retried.add(e); queue.push(e); again = true; } else solved++; }
        $("fb").innerHTML = `<div class="fb ${ok ? "ok" : "no"}"><b class="${ok ? "ok" : "no"}">${ok ? T("Верно! ✔","Correct! ✔") : T("Не совсем.","Not quite.")}</b>
          ${!ok ? `<div>${T("Правильный ответ:","Correct answer:")} <b>${esc(e.type === "order" ? e.sentence : want[0])}</b></div>` : ""}
          ${e.why ? `<div class="muted">${esc(e.why)}</div>` : ""}
          ${again ? `<div class="muted">${T("Это задание повторится в конце.","You'll get this one again at the end.")}</div>` : ""}
          <div class="row" style="justify-content:flex-end;margin-top:8px"><button class="btn" id="go">${T("Дальше →","Next →")}</button></div></div>`;
        $("go").onclick = next; $("go").focus();
        if(ok && (e.type === "listen" || e.type === "type" || e.type === "order")) say(e.type === "order" ? e.sentence : want[0]);
      };
      if(e.type === "choose" || e.type === "listen"){
        body.innerHTML = (e.type === "listen"
            ? `<p style="font-size:20px">${T("Послушай и выбери, что ты услышал:","Listen and pick what you heard:")}</p><div><button class="btn" id="play" style="font-size:20px">🔊 ${T("Послушать","Play")}</button></div>`
            : `<p style="font-size:22px">${esc(e.q)}</p>`)
          + `<div class="opts">${e.opts.map(o => `<button class="opt">${esc(o)}</button>`).join("")}</div>`;
        if(e.type === "listen"){ $("play").onclick = () => say(e.say); setTimeout(() => say(e.say), 250); }
        body.querySelectorAll(".opt").forEach(b => b.onclick = () => answer(b.textContent, b));
      } else if(e.type === "type"){
        body.innerHTML = `<p style="font-size:22px">${esc(e.q)}</p><input type="text" id="ta" autocomplete="off" spellcheck="false" placeholder="${T("Напиши ответ и нажми Enter","Type your answer and press Enter")}">
          <div class="row"><button class="btn" id="chk">${T("Проверить","Check")}</button></div>`;
        const wantRu = [].concat(e.a).some(w => /[а-яё]/i.test(w));
        ruBox($("ta"), wantRu); $("ta").focus();
        $("ta").onkeydown = ev => { if(ev.key === "Enter" && $("ta").value.trim()) answer($("ta").value); };
        $("chk").onclick = () => { if($("ta").value.trim()) answer($("ta").value); };
      } else if(e.type === "order"){
        const words = e.sentence.split(" "), pool = shuffle(words); let built = [];
        body.innerHTML = `<p style="font-size:20px">${T("Собери предложение:","Build the sentence:")} «${esc(e.mean)}»</p><div class="words" id="built"></div><div class="words" id="pool"></div>
          <div class="row"><button class="btn ghost" id="clr">${T("Сбросить","Clear")}</button><button class="btn" id="chk">${T("Проверить","Check")}</button></div>`;
        const draw = () => { $("built").innerHTML = built.map(w => `<button class="w">${esc(w)}</button>`).join("");
          const left = pool.slice(); built.forEach(w => left.splice(left.indexOf(w), 1));
          $("pool").innerHTML = left.map(w => `<button class="w">${esc(w)}</button>`).join("");
          [...$("pool").children].forEach(b => b.onclick = () => { built.push(b.textContent); draw(); });
          [...$("built").children].forEach((b, i) => b.onclick = () => { built.splice(i, 1); draw(); }); };
        $("clr").onclick = () => { built = []; draw(); };
        $("chk").onclick = () => { if(built.length) answer(built.join(" ")); };
        draw();
      }
    };
    next();
  };
  const finish = mistakes => {
    const stars = mistakes === 0 ? 3 : mistakes <= 2 ? 2 : 1, before = S.path[stepId(index)] || 0;
    if(stars > before) S.path[stepId(index)] = stars;
    addXP(before ? 2 : 10 + stars * 5);
    const hasNext = index + 1 < flatSteps().length;
    el.innerHTML = `<div class="card" style="text-align:center"><div style="font-size:48px">${"⭐".repeat(stars)}</div>
      <h2>${T("Шаг пройден!","Step complete!")}</h2><p class="muted">${T("Ошибок: ","Mistakes: ")}${mistakes}. ${stars < 3 ? T("Можно пройти ещё раз ради 3 звёзд.","You can redo it for 3 stars.") : T("Идеально!","Perfect!")}</p>
      <div class="row" style="justify-content:center">${hasNext ? `<button class="btn" id="nx">${T("Следующий шаг →","Next step →")}</button>` : ""}
      <button class="btn ghost" id="again">${T("Ещё раз","Again")}</button><button class="btn ghost" id="all">${T("Все шаги","All steps")}</button></div></div>`;
    if(hasNext) $("nx").onclick = () => runStep(el, index + 1);
    $("again").onclick = () => runStep(el, index);
    $("all").onclick = () => go("path");
  };
  learnView();
}

// ================================================================ start
const last = ls.get("ec-current", "");
if(last && profiles.some(p => p.id === last)) useProfile(last); else render();
</script>
